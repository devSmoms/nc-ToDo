org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Keep R8's pre-AGP-9 keep-rule semantics, so library rules that rely on the implicit
# default constructor (e.g. Room/WorkManager) keep working.
android.r8.strictFullModeForKeepRules=false

# Version shown in the Android app and the desktop app (one release = one number for all).
# Android additionally needs versionCode (app/build.gradle.kts) increased for every release.
nctodo.versionName=2.4.0
