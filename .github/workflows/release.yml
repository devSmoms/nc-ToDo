# Builds NC Todo for all platforms.
# - Tag push "v*": signed Android APK + Windows MSI + Linux DEB attached to one GitHub release.
# - Manual run ("Run workflow"): the files are attached to the run as artifacts (no release).
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    # Signing secrets live in this environment; it only allows tags "v*" and main (see repo settings).
    environment: release
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # No wrapper jar in the repo: use a fixed Gradle version instead.
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.6.0"

      - name: Restore signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Secret SIGNING_KEYSTORE_BASE64 is missing" >&2
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/NC-Todo-${GITHUB_REF_NAME//\//-}.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: NC-Todo-android
          path: dist/*

  # Installers must be built on their own operating system. No secrets needed here.
  desktop:
    strategy:
      matrix:
        include:
          - os: windows-latest
            task: packageMsi
            format: msi
            suffix: windows-x64.msi
          - os: ubuntu-latest
            task: packageDeb
            format: deb
            suffix: linux-amd64.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.6.0"

      - name: Build ${{ matrix.format }}
        run: gradle :desktop:${{ matrix.task }} --no-daemon

      - name: Rename installer
        shell: bash
        run: |
          mkdir -p dist
          file=$(ls desktop/build/compose/binaries/main/${{ matrix.format }}/*.${{ matrix.format }} | head -n 1)
          cp "$file" "dist/NC-Todo-${GITHUB_REF_NAME//\//-}-${{ matrix.suffix }}"

      - uses: actions/upload-artifact@v5
        with:
          name: NC-Todo-${{ matrix.format }}
          path: dist/*

  # Tag pushes: one GitHub release with APK, MSI and DEB.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the release
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
